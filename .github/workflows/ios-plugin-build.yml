name: iOS Plugin Build Test

on:
  push:
    branches:
      - ios-native-plugin-v0.0.13
      - ios-native-plugin-v0.0.14
      - ios-native-plugin-v0.0.15
      - ios-native-plugin-v0.0.16
      - ios-native-plugin-v0.0.17
    paths:
      - ios/**
      - lib/**
      - pubspec.yaml
      - example/**
      - .github/workflows/ios-plugin-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-plugin-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS example
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Use CocoaPods for Agora and CallKit plugins
        run: flutter config --no-enable-swift-package-manager

      - name: Resolve plugin packages
        run: flutter pub get

      - name: Resolve example packages
        working-directory: example
        run: flutter pub get

      - name: Match FlutterFlow static CocoaPods linkage
        run: |
          ruby <<'RUBY'
          path = 'example/ios/Podfile'
          text = File.read(path)

          if text.include?('use_frameworks!')
            text = text.gsub(
              /^\s*use_frameworks!.*$/,
              '  use_frameworks! :linkage => :static'
            )
          else
            marker = "target 'Runner' do\n"
            abort 'Runner target not found in example Podfile' unless text.include?(marker)
            text = text.sub(
              marker,
              marker + "  use_frameworks! :linkage => :static\n"
            )
          end

          File.write(path, text)
          RUBY

      - name: Build iOS release without signing
        working-directory: example
        run: flutter build ios --release --no-codesign

      - name: Verify native Agora bridge and exact RTC SDK
        run: |
          APP_BINARY="example/build/ios/iphoneos/Runner.app/Runner"
          test -f "$APP_BINARY"
          grep "AgoraRtcEngine_Special_iOS (4.5.3.70)" example/ios/Podfile.lock
          AGORA_BINARY="$(
            find example/ios/Pods \
              -type f \
              -path '*/AgoraRtcKit.framework/AgoraRtcKit' \
              -print -quit
          )"
          test -n "$AGORA_BINARY"
          echo "Agora binary: $AGORA_BINARY"
          nm -gU "$AGORA_BINARY" | grep '_OBJC_CLASS_\$_AgoraRtcEngineKit'
          grep -q "startIosAgoraVoiceCall" ios/Classes/TaxiCallkitBridgePlugin.swift
          grep -q "didActivate audioSession" ios/Classes/TaxiCallkitBridgePlugin.swift
