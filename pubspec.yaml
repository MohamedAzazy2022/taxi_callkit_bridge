name: taxi_callkit_bridge
description: Taxi native CallKit bridge.
publish_to: none
version: 0.0.19
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ">=5.0.0 <7.0.0"
  firebase_auth: ">=5.0.0 <7.0.0"
  firebase_core: ">=3.0.0 <5.0.0"
  firebase_messaging: ">=15.0.0 <17.0.0"

  flutter_callkit_incoming:
    git:
      url: https://github.com/MohamedAzazy2022/taxi_flutter_callkit_incoming.git
      ref: 2555ca1c9ae200754192c6197c70b57b04df328d
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.taxi_callkit_bridge
        pluginClass: TaxiCallkitBridgePlugin
      ios:
        pluginClass: TaxiCallkitBridgePlugin
